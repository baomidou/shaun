import java.time.LocalDateTime

apply plugin: 'com.vanniktech.maven.publish.base'

java {
    withSourcesJar()
    withJavadocJar()
}

def repositoryUrl = 'https://github.com/baomidou/shaun'

tasks.named('jar', Jar) {
    into('META-INF') {
        from rootProject.file('LICENSE')
    }
    from(tasks.named('generatePomFileForMavenJavaPublication')) {
        into "META-INF/maven/${project.group}/${project.name}"
        rename { 'pom.xml' }
    }
    manifest {
        attributes(
            'Implementation-Title': archiveBaseName.get(),
            'Implementation-Version': archiveVersion.get(),
            'Built-Gradle': gradle.gradleVersion,
            'Bundle-DocURL': repositoryUrl,
            'Build-OS': System.getProperty('os.name'),
            'Built-By': System.getProperty('user.name'),
            'Build-Jdk': System.getProperty('java.version'),
            'Build-Timestamp': LocalDateTime.now().format('yyyy-MM-dd HH:mm:ss'),
            'Automatic-Module-Name': "${project.group}.${project.name.replace('-', '.')}"
        )
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java

            pom {
                name = project.name
                description = rootProject.description
                url = repositoryUrl

                scm {
                    url = repositoryUrl
                    connection = "scm:git:${repositoryUrl}.git"
                    developerConnection = 'scm:git:ssh://git@github.com/baomidou/shaun.git'
                }

                licenses {
                    license {
                        name = 'The Apache License, Version 2.0'
                        url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
                    }
                }

                developers {
                    developer {
                        id = 'baomidou'
                        name = 'miemie'
                        email = 'wonderming@vip.qq.com'
                    }
                }

                withXml {
                    asNode().dependencies.dependency.findAll { node ->
                        node.scope.text() == 'runtime' && project.configurations.implementation.allDependencies.any { dependency ->
                            dependency.group == node.groupId.text() && dependency.name == node.artifactId.text()
                        }
                    }.each { node ->
                        node.scope[0].value = 'compile'
                        node.appendNode('optional', true)
                    }
                }
            }
        }
    }
}

mavenPublishing {
    publishToMavenCentral(false)
    signAllPublications()
}
