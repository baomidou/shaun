ext {
    pac4jVersion = "6.6.0"
    springBootVersion = "3.5.16"
    shiroVersion = "1.9.0"
    togglzVersion = "4.4.0"
}

def targetJava = JavaVersion.VERSION_17
int javaRelease = targetJava.majorVersion.toInteger()
def appGroup = providers.gradleProperty("APP_GROUP").get()
def appVersion = providers.gradleProperty("releaseVersion").orElse(providers.gradleProperty("APP_VERSION")).get()

allprojects {
    group = appGroup
    version = appVersion

    repositories {
        mavenLocal()
        mavenCentral()
        maven { url = "https://maven.aliyun.com/nexus/content/groups/public/" }
        maven { url = "https://oss.sonatype.org/content/repositories/snapshots/" }
    }
}

description = "基于 pac4j-jwt 的 WEB 安全组件"

subprojects {
    apply plugin: 'java-library'
    apply plugin: 'io.freefair.lombok'
    apply plugin: 'com.github.hierynomus.license'

    java {
        sourceCompatibility = targetJava
        targetCompatibility = targetJava
    }

    lombok {
        version = "1.18.48"
    }

    dependencies {
        implementation(platform("org.springframework.boot:spring-boot-dependencies:${springBootVersion}"))
        annotationProcessor(platform("org.springframework.boot:spring-boot-dependencies:${springBootVersion}"))

        testImplementation("org.assertj:assertj-core")
        testImplementation("org.junit.jupiter:junit-jupiter")
        testRuntimeOnly("org.junit.platform:junit-platform-launcher")
        testImplementation("org.mockito:mockito-junit-jupiter")
        testImplementation("ch.qos.logback:logback-classic")
    }

    tasks.withType(JavaCompile).configureEach {
        options.release = javaRelease
        options.encoding = 'UTF-8'
        options.compilerArgs.add('-parameters')
    }

    tasks.withType(GenerateModuleMetadata).configureEach {
        enabled = false
    }

    tasks.withType(Jar).configureEach {
        preserveFileTimestamps = false
        reproducibleFileOrder = true
    }

    def mainClasses = sourceSets.main.output.classesDirs
    def verifyBytecodeVersion = tasks.register('verifyBytecodeVersion') {
        group = 'verification'
        description = 'Verifies that compiled main classes target the configured Java release.'
        dependsOn tasks.named('classes')

        doLast {
            int expectedMajor = javaRelease + 44
            mainClasses.asFileTree.matching { include '**/*.class' }.each { classFile ->
                classFile.withDataInputStream { input ->
                    input.skipNBytes(6)
                    int major = input.readUnsignedShort()
                    if (major != expectedMajor) {
                        throw new GradleException("${classFile}: expected Java ${javaRelease} bytecode (major ${expectedMajor}), got ${major}")
                    }
                }
            }
        }
    }
    tasks.named('check') {
        dependsOn verifyBytecodeVersion
    }

    license {
        encoding = "UTF-8"
        header = rootProject.file("license.txt")
        include "**/*.java"
        exclude "**/test/**/*.java"
        exclude "**/*Test.java"
        mapping "java", "SLASHSTAR_STYLE"
        // Match the checked-in headers regardless of the build date.
        ext.year = 2024
    }

    tasks.named('clean') {
        delete layout.projectDirectory.dir('out')
    }

    tasks.named('javadoc', Javadoc) {
        options {
            encoding = 'UTF-8'
            charSet = 'UTF-8'
            author = true
            version = true
        }
    }

    tasks.named('test', Test) {
        useJUnitPlatform()
    }
}

configure([project(':shaun-core'), project(':shaun-spring-boot-starter'), project(':shaun-togglz')]) {
    apply from: rootProject.file('gradle/publications.gradle')
}
